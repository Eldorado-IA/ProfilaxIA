name: Verificacoes do ProfilaxIA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test-lock.txt
      - run: python -m pip install -r requirements-test-lock.txt
      - run: python -m pytest -v --junitxml=qa/resultados.xml
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: evidencias-api
          path: qa/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
